services:
  - type: web
    name: geopol-inteligencia-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run ingest
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.4
      - key: HOST
        value: 0.0.0.0
